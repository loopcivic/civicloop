services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civicloop_db
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civicpass
      POSTGRES_DB: civicloop
    ports:
      - "5432:5432"
    volumes:
      - civicloop_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civicloop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: civicloop_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - civicloop_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  civicloop_db_data:
  civicloop_redis_data:
